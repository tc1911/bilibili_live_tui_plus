name: release

# 打版本标签并推送（git tag v1.0.0 && git push origin v1.0.0）即触发
on:
  push:
    tags: ['v*']

permissions:
  contents: write # gh release create 需要

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --generate-notes 需要完整历史找上一个 tag

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 测试
        run: go test ./...

      - name: 交叉编译并打包 tar.gz
        run: |
          set -eu
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${t%/*}
            arch=${t#*/}
            if [ "$os" = windows ]; then bin=bili.exe; else bin=bili; fi
            d=dist/$os-$arch
            mkdir -p "$d"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags '-s -w' -o "$d/$bin" .
            cp LICENSE README.md "$d/"
            tar -C "$d" -czf "dist/bili_${GITHUB_REF_NAME}_${os}_${arch}.tar.gz" "$bin" LICENSE README.md
          done
          ls -lh dist/*.tar.gz

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --title "$GITHUB_REF_NAME" --generate-notes
