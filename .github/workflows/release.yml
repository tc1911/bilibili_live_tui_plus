name: release

# 打版本标签并推送（git tag v1.0.0 && git push origin v1.0.0）即触发
on:
  push:
    tags: ['v*']

permissions:
  contents: write # gh release create 需要

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --generate-notes 需要完整历史找上一个 tag

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 测试
        run: go test ./...

      - name: 编译并归档 tar.gz
        run: |
          set -eu
          mkdir -p dist/stage
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags '-s -w' -o dist/stage/bili .
          cp LICENSE README.md dist/stage/
          tar -C dist/stage -czf "dist/bili_${GITHUB_REF_NAME}_linux_amd64.tar.gz" bili LICENSE README.md

      - name: 装 nfpm
        env:
          NFPM_VERSION: 2.47.0
        run: |
          curl -sSfL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" | tar -xz nfpm
          sudo install -m755 nfpm /usr/local/bin/nfpm

      - name: 打 deb / rpm
        run: |
          set -eu
          export VERSION=${GITHUB_REF_NAME#v} # deb 版本号不能带前导 v
          nfpm package --config .github/nfpm.yaml --packager deb --target dist/
          nfpm package --config .github/nfpm.yaml --packager rpm --target dist/
          ls -lh dist/

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.deb dist/*.rpm --title "$GITHUB_REF_NAME" --generate-notes
